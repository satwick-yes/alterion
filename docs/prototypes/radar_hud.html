<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Tech Radar HUD - Revamped</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050508;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }

        #radarCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Add some gritty texture overlay using a CSS filter if possible, or just rely on canvas */
            filter: contrast(1.2) brightness(1.1);
        }

        /* Top Grid Overlay Container */
        .overlay {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.8;
        }

        .axis-labels {
            display: flex;
            justify-content: space-between;
            width: 80%;
            max-width: 900px;
            color: #e0e0e0;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .axis-line {
            width: 80%;
            max-width: 900px;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.6);
            position: relative;
            box-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        
        .axis-line::before, .axis-line::after {
            content: '';
            position: absolute;
            width: 1px;
            height: 15px;
            background-color: rgba(255, 255, 255, 0.8);
            top: -7px;
        }
        
        .axis-line::before { left: 0; }
        .axis-line::after { right: 0; }
        
        .ticks {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
        }
        
        .tick {
            width: 1px;
            height: 10px;
            background-color: rgba(255,255,255,0.4);
            margin-top: -4px;
        }

        /* Triangular/Hex Grid Simulation */
        .grid-mesh {
            width: 80%;
            max-width: 900px;
            height: 120px;
            margin-top: 5px;
            background-image: 
                linear-gradient(30deg, rgba(255,255,255,0.15) 1px, transparent 1px),
                linear-gradient(-30deg, rgba(255,255,255,0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 40px 69.28px, 40px 69.28px, 40px 40px;
            opacity: 0.5;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
        }
    </style>
</head>
<body>

    <div class="overlay">
        <div class="axis-labels">
            <span>0m</span>
            <span>1000m</span>
        </div>
        <div class="axis-line">
            <div class="ticks">
                <!-- generate some ticks -->
                <div class="tick"></div><div class="tick"></div><div class="tick"></div><div class="tick"></div>
                <div class="tick" style="height:15px; margin-top:-7px; background-color:rgba(255,255,255,0.8)"></div>
                <div class="tick"></div><div class="tick"></div><div class="tick"></div><div class="tick"></div>
            </div>
        </div>
        <div class="grid-mesh"></div>
    </div>

    <canvas id="radarCanvas"></canvas>

    <script>
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize
        
        let width, height, cx, cy;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        let time = 0;

        // Massive Particle System
        const particles = [];
        const numParticles = 2500;
        for (let i = 0; i < numParticles; i++) {
            // Power distribution so more particles are near the center
            const distRadius = Math.pow(Math.random(), 2) * (Math.max(width, height) / 1.5);
            particles.push({
                angle: Math.random() * Math.PI * 2,
                radius: distRadius,
                speed: (Math.random() - 0.5) * 0.005,
                radialSpeed: Math.random() * 0.5 + 0.1,
                size: Math.random() > 0.9 ? Math.random() * 3 + 1.5 : Math.random() * 1.5 + 0.5,
                brightness: Math.random()
            });
        }

        // Intense streaks/rays shooting outwards
        const streaks = [];
        for (let i = 0; i < 40; i++) {
            streaks.push({
                angle: Math.random() * Math.PI * 2,
                length: Math.random() * 600 + 200,
                width: Math.random() > 0.8 ? Math.random() * 3 + 2 : Math.random() * 1 + 0.5,
                dash: Math.random() > 0.5 ? [Math.random() * 50 + 10, Math.random() * 30 + 10] : [],
                opacity: Math.random() * 0.5 + 0.3,
                speed: (Math.random() - 0.5) * 0.001
            });
        }

        // Fake map paths for background
        const mapPaths = [];
        for(let i=0; i<8; i++) {
            let pts = [];
            let r = Math.random() * 300 + 200;
            let a = Math.random() * Math.PI * 2;
            let startX = cx + Math.cos(a) * r;
            let startY = cy + Math.sin(a) * r;
            pts.push({x: startX, y: startY});
            
            let currX = startX;
            let currY = startY;
            for(let j=0; j<15; j++) {
                currX += (Math.random() - 0.5) * 150;
                currY += (Math.random() - 0.5) * 150;
                pts.push({x: currX, y: currY});
            }
            mapPaths.push(pts);
        }

        function drawCircle(r, strokeStyle, lineWidth, dash = [], blur = 0, blurColor = '') {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = strokeStyle;
            ctx.lineWidth = lineWidth;
            if (dash.length > 0) {
                ctx.setLineDash(dash);
            } else {
                ctx.setLineDash([]);
            }
            if (blur > 0) {
                ctx.shadowBlur = blur;
                ctx.shadowColor = blurColor;
            } else {
                ctx.shadowBlur = 0;
            }
            ctx.stroke();
        }

        function render() {
            // Dark solid background
            ctx.fillStyle = '#08080b';
            ctx.fillRect(0, 0, width, height);

            time += 0.01;

            // --- 1. Map Background (Faint reddish/purple outlines) ---
            ctx.save();
            ctx.strokeStyle = 'rgba(150, 40, 60, 0.15)'; // Reddish faint lines
            ctx.lineWidth = 2;
            ctx.shadowBlur = 5;
            ctx.shadowColor = 'rgba(150, 40, 60, 0.3)';
            ctx.setLineDash([]);
            mapPaths.forEach(pts => {
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for(let i=1; i<pts.length; i++) {
                    ctx.lineTo(pts[i].x, pts[i].y);
                }
                ctx.stroke();
            });
            
            // Map Fill
            ctx.fillStyle = 'rgba(20, 5, 10, 0.3)';
            mapPaths.forEach(pts => {
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for(let i=1; i<pts.length; i++) {
                    ctx.lineTo(pts[i].x, pts[i].y);
                }
                ctx.fill();
            });
            ctx.restore();

            // --- 2. Intense Core Glow ---
            let coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 600);
            coreGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');       // Blinding white center
            coreGrad.addColorStop(0.1, 'rgba(255, 250, 200, 0.6)');   // Yellowish/cream intense glow
            coreGrad.addColorStop(0.25, 'rgba(180, 170, 140, 0.2)');  // Warm grey mid-glow
            coreGrad.addColorStop(0.5, 'rgba(100, 100, 100, 0.05)');  // Faint grey
            coreGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = coreGrad;
            ctx.fillRect(0, 0, width, height);

            // --- 3. Dense Mechanical Rings (The "Lens" effect) ---
            ctx.save();
            
            // Very tight inner rings (Mechanical details)
            drawCircle(30, 'rgba(255,255,255,0.8)', 4, [], 10, 'white');
            drawCircle(35, 'rgba(255,255,200,0.6)', 1, [2, 4]);
            drawCircle(45, 'rgba(200,200,200,0.5)', 8, [10, 5]);
            drawCircle(55, 'rgba(255,255,255,0.9)', 1, [], 15, 'white');
            
            // Rotating inner mechanical rings
            ctx.translate(cx, cy);
            ctx.rotate(time * 0.2);
            ctx.translate(-cx, -cy);
            drawCircle(70, 'rgba(220,220,200,0.7)', 12, [5, 15, 30, 5], 5, 'rgba(255,255,200,0.5)');
            drawCircle(78, 'rgba(255,255,255,0.8)', 2, [1, 5]);
            
            ctx.translate(cx, cy);
            ctx.rotate(-time * 0.4);
            ctx.translate(-cx, -cy);
            drawCircle(100, 'rgba(180,180,180,0.6)', 4, [40, 10, 5, 10]);
            drawCircle(110, 'rgba(255,255,255,0.4)', 0.5);
            drawCircle(130, 'rgba(255,255,220,0.5)', 20, [100, 20, 10, 20], 10, 'rgba(255,255,200,0.2)');
            
            ctx.restore();

            // Mid to outer rings (More spaced, thinner)
            ctx.save();
            drawCircle(170, 'rgba(255,255,255,0.3)', 1, [5, 5]);
            drawCircle(220, 'rgba(200,200,200,0.5)', 1.5, [15, 15]);
            drawCircle(280, 'rgba(255,255,255,0.2)', 0.5);
            
            ctx.translate(cx, cy);
            ctx.rotate(time * 0.05);
            ctx.translate(-cx, -cy);
            drawCircle(340, 'rgba(255,255,255,0.4)', 2, [150, 50, 10, 50], 10, 'rgba(255,255,255,0.3)');
            drawCircle(350, 'rgba(150,150,150,0.3)', 1, [2, 8]);
            
            drawCircle(450, 'rgba(180,180,180,0.15)', 10, [200, 100]);
            drawCircle(550, 'rgba(255,255,255,0.1)', 1, [50, 50]);
            ctx.restore();

            // Center Crosshair
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.9)';
            ctx.lineWidth = 1.5;
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'white';
            ctx.beginPath();
            ctx.moveTo(cx - 20, cy); ctx.lineTo(cx + 20, cy);
            ctx.moveTo(cx, cy - 20); ctx.lineTo(cx, cy + 20);
            ctx.stroke();
            
            // Outer targeting brackets
            ctx.beginPath();
            let b = 150;
            let s = 15;
            // Top Left
            ctx.moveTo(cx-b, cy-b+s); ctx.lineTo(cx-b, cy-b); ctx.lineTo(cx-b+s, cy-b);
            // Top Right
            ctx.moveTo(cx+b-s, cy-b); ctx.lineTo(cx+b, cy-b); ctx.lineTo(cx+b, cy-b+s);
            // Bottom Right
            ctx.moveTo(cx+b, cy+b-s); ctx.lineTo(cx+b, cy+b); ctx.lineTo(cx+b-s, cy+b);
            // Bottom Left
            ctx.moveTo(cx-b+s, cy+b); ctx.lineTo(cx-b, cy+b); ctx.lineTo(cx-b, cy+b-s);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.stroke();
            ctx.restore();

            // --- 4. Streaks/Rays (Removed by user request) ---


            // --- 5. Massive Particle Cloud ---
            ctx.save();
            ctx.setLineDash([]);
            
            // We'll draw particles in batches to minimize state changes
            ctx.fillStyle = 'white';
            ctx.beginPath();
            
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.angle += p.speed;
                p.radius += p.radialSpeed;
                
                // Reset particle if it goes too far
                if (p.radius > Math.max(width, height)) {
                    p.radius = Math.random() * 100; // Reset near center
                }

                let x = cx + Math.cos(p.angle) * p.radius;
                let y = cy + Math.sin(p.angle) * p.radius;

                // Opacity is based on distance and individual brightness
                // Particles near center are brighter
                let distNorm = 1 - (p.radius / (Math.max(width, height) / 1.2));
                if(distNorm < 0) distNorm = 0;
                
                let alpha = p.brightness * distNorm;
                
                if (alpha > 0.05) {
                    ctx.globalAlpha = alpha;
                    ctx.moveTo(x, y);
                    ctx.arc(x, y, p.size, 0, Math.PI * 2);
                }
            }
            ctx.fill();
            ctx.globalAlpha = 1.0;
            ctx.restore();


            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
